<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player</title>
<script data-cfasync="false" async type="text/javascript" src="//ao.organicpimping.com/r91qETodgwgdIk9G8/150169"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://remoteconsultinggroup.site">
<link rel="dns-prefetch" href="https://remoteconsultinggroup.site">

<style>
:root{--bg:#0a0a0a;--surface:#141414;--red:#E50914;--red-dark:#B20710;--text:#ffffff;--text-dim:#b3b3b3;--text-faint:#7a7a7a;--track:rgba(255,255,255,0.24);}
*{box-sizing:border-box;}
body{margin:0;background:#000;font-family:'Inter',sans-serif;overflow:hidden}
.player{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden;cursor:none;}
.player.controls-visible{cursor:default;}
video{width:100%;height:100%;display:block;object-fit:cover;background:#000;}
.top-bar{position:absolute;top:0;left:0;right:0;padding:28px 32px 60px;background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.35) 55%,transparent 100%);opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s;pointer-events:none;}
.player.controls-visible .top-bar,.player.paused .top-bar{opacity:1;transform:translateY(0);}
.title-eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px;}
.title-main{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--text);line-height:1;}
.title-sub{font-size:13px;color:var(--text-dim);font-weight:500;margin-top:6px;}
.center-toggle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:none;z-index:2;}
.player.controls-visible .center-toggle,.player.paused .center-toggle{cursor:pointer;}
.big-play{width:84px;height:84px;border-radius:50%;background:rgba(14,14,14,0.6);border:1.5px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.8);transition:opacity .3s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s,box-shadow .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 16px 44px rgba(0,0,0,.45);}
.player.loading .big-play,.player.loading .play-btn{opacity:0!important;pointer-events:none;}
.player.paused .big-play{opacity:1;transform:scale(1);}
/* Scoped under .paused so it outranks the .player.paused .big-play reset above. */
.player.paused .big-play:hover{background:rgba(var(--brand-rgb),0.9);border-color:rgba(255,255,255,0.5);box-shadow:0 16px 50px rgba(var(--brand-rgb),.45);transform:scale(1.06);}
.big-play svg{width:32px;height:32px;fill:#fff;margin-left:3px;}
.player:not(.paused) .big-play svg{margin-left:0;}
.player:not(.paused) .big-play svg.icon-play{display:none;}
.player.paused .big-play svg.icon-pause{display:none;}
.flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;z-index:3;}
.player.loading .flash{display:none!important;}
.flash svg{width:34px;height:34px;fill:#fff;}
.flash.show{animation:flashPop .5s forwards;}
@keyframes flashPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;padding:0 24px 16px;background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.55) 55%,transparent 100%);opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s;z-index:4;}
.player.controls-visible .bottom-bar,.player.paused .bottom-bar{opacity:1;transform:translateY(0);}
/* The scrubber spans the full width — the clock moved down into the button
   row, where it costs no seek distance. */
.progress-row{padding:10px 0 6px;}
.progress-track{position:relative;height:4px;border-radius:999px;background:var(--track);cursor:pointer;touch-action:none;transition:height .14s cubic-bezier(.16,1,.3,1);}
/* Invisible padding so the pointer target is ~24px tall without moving anything. */
.progress-track:before{content:'';position:absolute;left:0;right:0;top:-10px;bottom:-10px;}
.progress-track:hover,.progress-track.scrubbing{height:7px;}
.progress-buffered{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,0.26);border-radius:inherit;width:0%;}
.progress-hover{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,0.4);border-radius:inherit;width:0;pointer-events:none;}
.progress-fill{position:absolute;top:0;left:0;height:100%;background:var(--brand);border-radius:inherit;width:0%;box-shadow:0 0 12px rgba(var(--brand-rgb),0.55);}
.progress-handle{position:absolute;top:50%;left:0%;width:14px;height:14px;background:var(--brand);border-radius:50%;transform:translate(-50%,-50%) scale(0);transition:transform .16s cubic-bezier(.16,1,.3,1);box-shadow:0 0 0 5px rgba(var(--brand-rgb),0.22),0 2px 8px rgba(0,0,0,.5);}
.progress-track:hover .progress-handle,.progress-track.scrubbing .progress-handle{transform:translate(-50%,-50%) scale(1);}
.progress-tip{position:absolute;bottom:20px;left:0;transform:translateX(-50%);padding:4px 8px;border-radius:6px;background:rgba(10,10,10,.94);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none;transition:opacity .14s;white-space:nowrap;}
.progress-track:hover .progress-tip,.progress-track.scrubbing .progress-tip{opacity:1;}
.controls-row{display:flex;align-items:center;gap:8px;}
.controls-left,.controls-right{display:flex;align-items:center;gap:2px;}
.controls-right{margin-left:auto;}
/* Real 38px hit targets with a visible hover pill — the old naked icons were
   ~30px of guesswork with 18px of dead gap between them. */
.ctrl-btn{width:38px;height:38px;flex-shrink:0;padding:0;background:none;border:none;border-radius:10px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .16s,transform .12s;}
.ctrl-btn:hover{background:rgba(255,255,255,0.14);}
.ctrl-btn:active{transform:scale(.93);}
.ctrl-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.ctrl-btn svg{width:21px;height:21px;fill:#fff;pointer-events:none;}
.ctrl-btn:has(+ .panel.show){background:rgba(var(--brand-rgb),0.2);}
.play-btn{width:42px;height:42px;}
.play-btn svg{width:25px;height:25px;}
.play-btn:hover{background:rgba(var(--brand-rgb),0.25);}
.player:not(.paused) .play-btn .icon-play{display:none;}
.player.paused .play-btn .icon-pause{display:none;}
.skip-btn svg{width:23px;height:23px;}
.time-label{margin:0 6px 0 4px;font-size:12.5px;font-weight:600;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
.time-label b{color:#fff;font-weight:600;}
.volume-group{display:flex;align-items:center;}
.volume-track{width:0;height:4px;margin-right:0;border-radius:999px;background:var(--track);position:relative;cursor:pointer;transition:width .22s cubic-bezier(.16,1,.3,1),margin-right .22s;}
.volume-group:hover .volume-track,.volume-group:focus-within .volume-track{width:74px;margin-right:8px;}
.volume-fill{position:absolute;top:0;left:0;height:100%;width:80%;background:#fff;border-radius:inherit;}
/* The handle must fade with the track — a 0-width slider still has a right
   edge, so an always-on dot floats next to the mute icon. */
.volume-fill:after{content:'';position:absolute;right:0;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .18s;}
.volume-group:hover .volume-fill:after,.volume-group:focus-within .volume-fill:after{opacity:1;}
.ep-label{flex:1;min-width:0;padding:0 14px;font-size:13px;color:var(--text-dim);font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panel{position:absolute;bottom:52px;right:0;min-width:210px;max-height:min(70vh,540px);overflow-y:auto;background:rgba(18,18,18,0.94);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:7px;box-shadow:0 18px 50px rgba(0,0,0,0.6);z-index:8;opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;transition:opacity .2s cubic-bezier(.16,1,.3,1),transform .2s cubic-bezier(.16,1,.3,1);}
.panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.panel-header{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-faint);font-weight:700;padding:8px 10px 6px;}
.panel-divider{height:1px;background:rgba(255,255,255,0.1);margin:6px 4px;}
.subtitle-sync{display:flex;align-items:center;gap:8px;padding:5px 10px 8px;}
.sync-step{width:30px;height:30px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:linear-gradient(180deg,#292929,#171717);color:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.28);}
.sync-step:hover{border-color:var(--brand);color:#fff;transform:translateY(-1px);}
.sync-value{min-width:62px;text-align:center;color:#f2f2f2;font:600 11px 'Inter',sans-serif;letter-spacing:.02em;}
.sync-reset{margin-left:auto;background:none;border:0;color:var(--text-faint);font-size:11px;cursor:pointer;}
.sync-reset:hover{color:#fff;}
.panel-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;color:#e8e8e8;font-size:13.5px;font-weight:500;text-align:left;padding:10px 11px;border-radius:8px;cursor:pointer;transition:background .12s,color .12s;}
.panel-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.panel-item.active{color:var(--brand);background:rgba(var(--brand-rgb),0.12);}
.panel-item .check{width:15px;height:15px;fill:var(--brand);opacity:0;flex-shrink:0;}
.panel-item.active .check{opacity:1;}
.panel-item .tag{font-size:10px;font-weight:700;color:#7ed957;background:rgba(126,217,87,.14);padding:2px 6px;border-radius:3px;}
.loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.18);z-index:1;}
.loader.show{display:flex;}
.loader-ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--brand);animation:spin .9s linear infinite;}
.loader-card{display:grid;justify-items:center;gap:14px;padding:18px 22px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(8,8,8,.82);box-shadow:0 12px 32px rgba(0,0,0,.32);}
.loader-status{color:var(--text-dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
@keyframes spin{to{transform:rotate(360deg);}}
.caption-overlay{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);max-width:80%;padding:5px 12px;background:rgba(0,0,0,.65);color:#fff;font-size:17px;font-weight:500;text-align:center;border-radius:3px;line-height:1.4;opacity:0;transition:opacity .15s;z-index:2;pointer-events:none;}
.caption-overlay.show{opacity:1;}
.intro-skip{position:absolute;right:28px;bottom:88px;z-index:11;display:none;border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:10px 13px;background:rgba(0,0,0,.76);color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.intro-skip.show{display:block;}
.next-up-card{position:absolute;right:28px;bottom:86px;z-index:12;display:none;align-items:center;gap:16px;max-width:min(430px,calc(100% - 56px));padding:14px 14px 14px 16px;border:1px solid rgba(229,9,20,.55);border-radius:8px;background:rgba(12,12,12,.95);box-shadow:0 16px 40px rgba(0,0,0,.5);color:#fff;}
.next-up-card.show{display:flex;}
.next-up-copy{display:grid;gap:4px;min-width:0;}
.next-up-copy span,.next-up-copy small{color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;}
.next-up-copy strong{overflow:hidden;font-size:14px;white-space:nowrap;text-overflow:ellipsis;}
.next-up-card button{border:0;border-radius:4px;padding:9px 11px;background:var(--red);color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.next-up-card .next-up-cancel{padding:5px;background:transparent;color:var(--text-dim);font-weight:400;}
@media (max-width:560px){.next-up-card{right:10px;bottom:70px;max-width:calc(100% - 20px);gap:8px;padding:10px;}.next-up-copy strong{font-size:12px;}.next-up-copy small{display:none;}.next-up-card button{padding:8px;font-size:10px;}}
.preroll{position:absolute;inset:0;z-index:20;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .55s ease,transform .55s cubic-bezier(.16,1,.3,1);}
.preroll.hide{opacity:0;transform:scale(1.05);pointer-events:none;}
.preroll-bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(110% 75% at 50% 42%,rgba(var(--brand-rgb),.10),transparent 62%),#050505;}
.preroll-bg:before{content:'';position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent 0deg,rgba(var(--brand-rgb),.18) 45deg,transparent 120deg,transparent 240deg,rgba(255,255,255,.05) 300deg,transparent 355deg);animation:prerollAura 18s linear infinite;opacity:.7;}
.preroll-bg:after{content:'';position:absolute;inset:0;background:radial-gradient(125% 95% at 50% 50%,transparent 42%,rgba(0,0,0,.88) 100%);}
@keyframes prerollAura{to{transform:rotate(360deg);}}
.preroll-card{position:relative;z-index:2;width:min(440px,calc(100vw - 40px));animation:prerollRise .8s cubic-bezier(.16,1,.3,1) both;}
@keyframes prerollRise{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(6px);}to{opacity:1;transform:none;filter:none;}}
.preroll-mark{display:flex;align-items:center;min-height:46px;margin-bottom:16px;}
.preroll-logo{max-height:46px;max-width:200px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(var(--brand-rgb),.45));animation:prerollMark 1s cubic-bezier(.16,1,.3,1) both;}
.preroll-monogram{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--brand),rgba(0,0,0,.4));box-shadow:0 0 26px rgba(var(--brand-rgb),.4),inset 0 1px 0 rgba(255,255,255,.28);font-family:'Bebas Neue',sans-serif;font-size:27px;line-height:1;color:#fff;animation:prerollMark 1s cubic-bezier(.16,1,.3,1) both;}
@keyframes prerollMark{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:none;}}
.preroll-brand{margin-bottom:9px;color:var(--brand);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;animation:prerollTrack .9s .08s cubic-bezier(.16,1,.3,1) both;}
@keyframes prerollTrack{from{opacity:0;letter-spacing:.5em;}to{opacity:1;letter-spacing:.22em;}}
.preroll-title{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1.06;letter-spacing:.04em;color:#fff;animation:prerollRise .9s .16s cubic-bezier(.16,1,.3,1) both;}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .preroll-title{background:linear-gradient(100deg,#fff 34%,rgba(255,255,255,.5) 46%,#fff 58%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:prerollRise .9s .16s cubic-bezier(.16,1,.3,1) both,prerollSheen 5s 1.1s ease-in-out infinite;}
}
@keyframes prerollSheen{0%{background-position:130% 0;}45%,100%{background-position:-30% 0;}}
.preroll-status-wrap{height:26px;position:relative;margin-top:10px;overflow:hidden;}
.preroll-status{position:absolute;inset:0;display:flex;align-items:center;color:rgba(255,255,255,.62);font-size:12px;letter-spacing:.03em;}
.preroll-status.enter{animation:prerollStatusIn .34s cubic-bezier(.16,1,.3,1) forwards;}
.preroll-status.leave{animation:prerollStatusOut .24s ease-in forwards;}
@keyframes prerollStatusIn{from{opacity:0;transform:translateY(8px);filter:blur(3px);}to{opacity:1;transform:none;filter:none;}}
@keyframes prerollStatusOut{to{opacity:0;transform:translateY(-8px);filter:blur(3px);}}
.preroll-server{position:absolute;right:0;top:0;color:var(--brand);font-size:11px;font-weight:700;line-height:26px;letter-spacing:.06em;}
.preroll-server .ok-tag{margin-left:6px;padding:3px 7px;border-radius:999px;background:rgba(var(--brand-rgb),.16);font-size:9px;letter-spacing:.12em;text-transform:uppercase;}
.preroll-progress{position:relative;height:2px;margin-top:20px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.1);}
.preroll-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,rgba(var(--brand-rgb),.5),var(--brand));box-shadow:0 0 14px rgba(var(--brand-rgb),.75);transition:width .35s cubic-bezier(.16,1,.3,1);}
.preroll-progress:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-100%);animation:prerollShimmer 1.9s ease-in-out infinite;}
@keyframes prerollShimmer{to{transform:translateX(100%);}}
.preroll-footline{display:flex;justify-content:space-between;margin-top:12px;color:rgba(255,255,255,.38);font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
.preroll-pct{color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;}
.preroll-switcher{display:flex;gap:5px;margin-top:18px;}
.preroll-rail-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.preroll-node{flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.12);transition:background .25s ease,box-shadow .25s ease,opacity .25s ease;}
.preroll-node.probing{background:var(--brand);animation:prerollNode 1.15s ease-in-out infinite;}
@keyframes prerollNode{0%,100%{opacity:.35;}50%{opacity:1;box-shadow:0 0 12px rgba(var(--brand-rgb),.6);}}
.preroll-node.failed{background:rgba(255,255,255,.14);opacity:.45;}
.preroll-node.ready{background:var(--brand);box-shadow:0 0 12px rgba(var(--brand-rgb),.55);}
.preroll-node .region,.preroll-node .sub,.preroll-node .tag{display:none;}
.preroll-card.connected .preroll-mark{animation:prerollLock .6s cubic-bezier(.16,1,.3,1);}
@keyframes prerollLock{40%{transform:scale(1.07);}to{transform:none;}}
.preroll.connected .preroll-bg:before{animation-duration:6s;}
@media (max-width:560px){
  .title-main{font-size:24px;}
  .bottom-bar{padding:0 8px max(10px,env(safe-area-inset-bottom));}
  .progress-row{padding:8px 4px 2px;}
  .controls-row{gap:0;}
  .controls-left,.controls-right{gap:0;min-width:0;}
  .controls-left{flex:1;}
  .controls-right{flex-shrink:0;margin-left:0;}
  /* 36px is the smallest comfortable thumb target; nine of them plus a clock
     is already 392px, so anything narrower has to drop controls, not shrink
     them further — see the 430px block below. */
  .ctrl-btn{width:36px;height:36px;border-radius:10px;}
  .ctrl-btn svg{width:21px;height:21px;}
  .play-btn{width:40px;height:40px;}
  .play-btn svg{width:23px;height:23px;}
  .time-label{margin:0 4px;font-size:11.5px;}
  .progress-tip{display:none;}
  .volume-track,.ep-label{display:none;}
  .big-play{width:72px;height:72px;}
  .big-play svg{width:28px;height:28px;}
  .panel{position:fixed;left:0;right:0;bottom:0;width:100%;min-width:0;max-height:72dvh;overflow:auto;padding:18px 14px max(18px,env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.14);border-bottom:0;border-radius:22px 22px 0 0;background:rgba(20,20,20,.98);box-shadow:0 -18px 50px rgba(0,0,0,.58);transform:translateY(110%);}
  .panel.show{transform:translateY(0);}
  .panel:before{content:'';display:block;width:38px;height:4px;margin:0 auto 12px;border-radius:999px;background:rgba(255,255,255,.3);}
  .panel-header{font-size:12px;padding:9px 10px 8px;}
  .panel-item{min-height:44px;padding:11px 10px;font-size:14px;}
  .preroll-mark{min-height:34px;margin-bottom:12px;}
  .preroll-logo{max-height:34px;max-width:150px;}
  .preroll-monogram{width:34px;height:34px;border-radius:10px;font-size:20px;}
  .preroll-brand{margin-bottom:6px;font-size:10px;}
  .preroll-title{font-size:23px;}
  .preroll-server{position:static;display:block;line-height:20px;}
  .preroll-status-wrap{height:24px;margin-top:4px;}
  .preroll-progress{margin-top:14px;}
  .preroll-footline{margin-top:8px;}
  .preroll-switcher{margin-top:14px;}
}
/* Under ~430px the full control set overflows the bar and the right-hand
   buttons walk off screen. Skip ±10s and the total duration are the two
   things a phone can lose without losing a capability — dragging the
   scrubber still seeks, and the elapsed time still reads. */
@media (max-width:430px){
  .skip-btn,.time-dur{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .preroll,.preroll *,.preroll *:before,.preroll *:after{animation:none!important;transition:none!important;}
  /* The sheen leaves the gradient parked off-screen without its animation. */
  .preroll-title{background:none;-webkit-text-fill-color:#fff;color:#fff;}
}
</style>
<style>.top-bar{display:none!important;}
:root{--brand:#E50914;--brand-rgb:229,9,20;}</style>

  function qualityLabel(level){var width=Number(level&&level.width)||video.videoWidth||0;return width>=1920?'1080p':width>=1280?'720p':width>=854?'480p':'360p';}
  function qualityOptionsForMobile(){return [{option:'quality',value:'auto',label:'Auto',group:'Quality'}].concat((hls&&hls.levels||[]).map(function(level,index){return {option:'quality',value:String(index),label:qualityLabel(level),group:'Quality'};}));}
  function setQuality(value){if(!hls)return;if(value==='auto')hls.currentLevel=-1;else{var index=Number(value);if(Number.isInteger(index)&&hls.levels[index])hls.currentLevel=index;}settingsPanel.querySelectorAll('[data-quality]').forEach(function(btn){btn.classList.toggle('active',btn.dataset.quality===String(value));});closeAllPanels();}
  function applyQualityPreference(label){if(!hls||!hls.levels||!hls.levels.length)return;if(!label||label==='Auto'){setQuality('auto');return;}var match=-1;hls.levels.forEach(function(level,index){if(qualityLabel(level)===label)match=index;});if(match>=0)setQuality(String(match));else setQuality('auto');}
  function renderQualityOptions(){if(!hls||!hls.levels.length)return;if(!qualityOptions){var autoButton=settingsPanel.querySelector('[data-quality="auto"]');qualityOptions=document.createElement('div');autoButton.after(qualityOptions);settingsPanel.querySelectorAll('[data-quality]:not([data-quality="auto"])').forEach(function(btn){btn.style.display='none';});autoButton.onclick=function(){setQuality('auto');};}qualityOptions.innerHTML=hls.levels.map(function(level,index){return '<button class="panel-item" data-quality="'+index+'"><span>'+qualityLabel(level)+'</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></button>';}).join('');qualityOptions.querySelectorAll('[data-quality]').forEach(function(btn){btn.onclick=function(){setQuality(btn.dataset.quality);};});setQuality('auto');}

  // Fullscreen
  video.addEventListener('webkitbeginfullscreen',function(){isNativeFullscreen=true;syncNativeSubtitle();});
  video.addEventListener('webkitendfullscreen',function(){isNativeFullscreen=false;syncNativeSubtitle();updateCaptions();});
  document.getElementById('fullscreenBtn').addEventListener('click',function(){
    if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();}
    else if(!document.fullscreenElement){player.requestFullscreen();}
    else{document.exitFullscreen();}
  });

  // Auto-hide
  function showC(){player.classList.add('controls-visible');clearTimeout(hideTimer);if(!video.paused)hideTimer=setTimeout(function(){player.classList.remove('controls-visible');closeAllPanels();},2800);}
  player.addEventListener('mousemove',showC);
  player.addEventListener('touchstart',showC,{passive:true});
  player.addEventListener('mouseleave',function(){if(!video.paused)player.classList.remove('controls-visible');});
  showC();

  // Loading — debounce to avoid flash on seek/start
  var waitTimer=null;
  video.addEventListener('waiting',function(){clearTimeout(waitTimer);waitTimer=setTimeout(function(){if(!document.getElementById('preroll').classList.contains('hide'))return;player.classList.add('loading');loader.classList.add('show');},800);});
  video.addEventListener('canplay',function(){clearTimeout(waitTimer);player.classList.remove('loading');loader.classList.remove('show');});
  video.addEventListener('playing',function(){clearTimeout(waitTimer);player.classList.remove('loading');loader.classList.remove('show');});
  video.addEventListener('ended',function(){
    try{ window.parent.postMessage({type:'vidrift:ended',tmdbId:embedMeta.tmdbId,mediaType:embedMeta.type,season:embedMeta.season,episode:embedMeta.episode},'*'); }catch(e){}
  });
  var nextUpSent=false;
  video.addEventListener('timeupdate',function(){
    if(!nextUpSent&&video.duration>0&&video.duration-video.currentTime<=30){
      nextUpSent=true;showNextUp();
      try{ window.parent.postMessage({type:'vidrift:nextup',tmdbId:embedMeta.tmdbId,mediaType:embedMeta.type,season:embedMeta.season,episode:embedMeta.episode},'*'); }catch(e){}
    }
  });

  // Keyboard
  document.addEventListener('keydown',function(e){
    if(['Space','ArrowLeft','ArrowRight','KeyF','KeyM'].includes(e.code)||e.key===' '){e.preventDefault();}
    if(e.code==='Space')togglePlay();
    if(e.code==='ArrowLeft')video.currentTime=Math.max(0,video.currentTime-5);
    if(e.code==='ArrowRight')video.currentTime=Math.min(video.duration||0,video.currentTime+5);
    if(e.code==='KeyF'){if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();}else if(!document.fullscreenElement){player.requestFullscreen();}else{document.exitFullscreen();}}
    if(e.code==='KeyM')document.getElementById('muteBtn').click();
    showC();
  });

  var providerCursor=0;
  var providerLoadGeneration=0; // invalidates stale provider responses after a switch
  var raceFallbackProvider=null;
  function providerLabel(provider){return provider==='vidgod'?'Prime':provider==='turbo'?'Turbo':provider==='selfhost'?'Direct':'Earth';}
  function sourceTypePath(){return embedMeta.type==='tv'?'tv/'+embedMeta.tmdbId+'/'+embedMeta.season+'/'+embedMeta.episode:'movie/'+embedMeta.tmdbId;}
  function probeMediaBytes(buffer){
    if(!buffer||buffer.byteLength<4)return false;
    var bytes=new Uint8Array(buffer),text='';
    for(var i=0;i<Math.min(bytes.length,64);i++)text+=String.fromCharCode(bytes[i]);
    return bytes[0]===0x47||text.indexOf('ftyp')>=0;
  }
  function probeHlsPlaylist(url,depth,signal){
    if(depth>2)return Promise.resolve(false);
    return fetch(url,{cache:'no-store',signal:signal}).then(function(response){
      if(!response.ok)return false;
      return response.arrayBuffer().then(function(buffer){
        if(probeMediaBytes(buffer))return true;
        var text=new TextDecoder().decode(buffer);
        if(!text.includes('#EXTM3U'))return false;
        var lines=text.split(/\r?\n/).map(function(line){return line.trim();}).filter(function(line){return line&&!line.startsWith('#')&&!line.startsWith('//');});
        return lines.length?probeHlsPlaylist(lines[0],depth+1,signal):false;
      });
    }).catch(function(){return false;});
  }
  function probeEarthSource(url){
    var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},5000);
    return probeHlsPlaylist(url,0,controller.signal).finally(function(){clearTimeout(timer);});
  }
  function orderPlayableEarthSources(items){
    if(items.length<2)return Promise.resolve(items);
    var checks=items.map(function(item,index){
      return probeEarthSource(item.url).then(function(ok){return ok?index:Promise.reject(new Error('unplayable'));});
    });
    return Promise.any(checks).then(function(winner){
      return [items[winner]].concat(items.filter(function(_,index){return index!==winner;}));
    }).catch(function(){return items;});
  }
  function loadProviderAt(index){
    if(index<0||index>=providers.length){
      sourceSwitching=false;
      if(finishPreroll)finishPreroll();
      player.classList.remove('loading');loader.classList.remove('show');
      setLoaderStatus('Internal sources unavailable — switching to CinemaOS…');
      try{ window.parent.postMessage({type:'vidrift:external-fallback',provider:'cinemaos',tmdbId:embedMeta.tmdbId,mediaType:embedMeta.type,season:embedMeta.season,episode:embedMeta.episode,currentTime:video.currentTime||0},'*'); }catch(e){}
      return;
    }
    providerCursor=index;
    currentProvider=providers[index];
    sourceSwitching=true;
    var loadGeneration=++providerLoadGeneration;
    var label=providerLabel(currentProvider);
    setStage('Contacting '+label,35);pFoot.textContent='Looking for '+label+' sources…';
    fetch('/api/source/'+sourceTypePath()+'?token='+encodeURIComponent(embedMeta.playbackToken)+'&provider='+encodeURIComponent(currentProvider))
      .then(function(r){return r.ok?r.json():null;})
      .then(function(data){
        if(loadGeneration!==providerLoadGeneration)return;
        sourceSwitching=false;
        if(!data||!Array.isArray(data.streams)||!data.streams.length){loadProviderAt(index+1);return;}
        streams=data.streams.map(function(s,i){return{index:i,provider:currentProvider,pIdx:i,type:s.type||'hls',label:label+' '+(i+1),url:(s.url||s.proxyUrl)};});
        var orderPromise=currentProvider==='vaplayer'?orderPlayableEarthSources(streams):Promise.resolve(streams);
        setStage(currentProvider==='vaplayer'?'Racing Earth sources':'Loading '+label,55);
        pFoot.textContent=currentProvider==='vaplayer'?'Testing '+streams.length+' Earth sources in parallel…':'Trying '+label+'…';
        return orderPromise.then(function(orderedStreams){
          streams=orderedStreams;
        attemptedSources={};prerollStates={};
        // Boot at the remembered source: global majority memory (embedMeta.source) first,
        // per-browser localStorage layered on top, fall back to 0. Was hardcoded to 0
        // (memory was write-only) — fixed 2026-08-05.
        var preferred = currentProvider==='vaplayer' ? 0 : (Number(embedMeta.source) || 0);
        var local = currentProvider==='vaplayer' ? -1 : preferredSource(streams.length);
        if (local >= 0) preferred = local;
        if (!(preferred >= 0 && preferred < streams.length)) preferred = 0;
        currentSource = preferred;
        setStage('Loading '+streams[currentSource].label,70);pFoot.textContent='Trying '+streams[currentSource].label+' of '+streams.length;
        renderPrerollRail(currentSource);updateServerPanel();loadStream(currentSource,true);
        });
      }).catch(function(){
        if(loadGeneration!==providerLoadGeneration)return;
        sourceSwitching=false;loadProviderAt(index+1);
      });
  }
  function loadNextProvider(){
    if(raceFallbackProvider!==null){
      var raced=raceFallbackProvider;raceFallbackProvider=null;loadProviderAt(raced);return;
    }
    var next=providerCursor+1;
    if(next>=providers.length){loadProviderAt(next);return;}
    var label=providerLabel(providers[next]);
    setLoaderStatus(providerLabel(currentProvider)+' unavailable — trying '+label+'…');
    setStage('Trying '+label,55);pFoot.textContent='All '+providerLabel(currentProvider)+' sources failed — contacting '+label;
    loadProviderAt(next);
  }
  function raceInitialProviders(){
    var raceGeneration=++providerLoadGeneration;
    // Turbo is a LAST-RESORT fallback (2026-08-18): EXCLUDE it from the initial
    // race. A cached Turbo manifest resolves instantly and would win Promise.any,
    // silently making Turbo primary again — the opposite of Earth+Prime default.
    // Only Earth + Prime race; Turbo is reached via sequential failover.
    var primaries = providers.filter(function(p){return p!=='turbo';});
    if(!primaries.length) primaries = providers.slice();
    var tasks=primaries.map(function(provider){
      var index=providers.indexOf(provider);
      var label=providerLabel(provider);
      return fetch('/api/source/'+sourceTypePath()+'?token='+encodeURIComponent(embedMeta.playbackToken)+'&provider='+encodeURIComponent(provider))
        .then(function(r){return r.ok?r.json():null;})
        .then(function(data){
          if(!data||!Array.isArray(data.streams)||!data.streams.length)throw new Error('no streams');
          var items=data.streams.map(function(s,i){return{index:i,provider:provider,pIdx:i,type:s.type||'hls',label:label+' '+(i+1),url:(s.url||s.proxyUrl)};});
          // Earth gets its existing manifest/segment probe; Prime is handed to
          // the media element immediately because its direct MP4 is the probe.
          return (provider==='vaplayer'?orderPlayableEarthSources(items):Promise.resolve(items)).then(function(ordered){return{provider:provider,index:index,streams:ordered};});
        });
    });
    Promise.any(tasks).then(function(winner){
      if(raceGeneration!==providerLoadGeneration)return;
      currentProvider=winner.provider;providerCursor=winner.index;
      var other = primaries.find(function(p){return p!==winner.provider;});
      raceFallbackProvider = other ? providers.indexOf(other) : -1;
      streams=winner.streams;sourceSwitching=false;attemptedSources={};prerollStates={};
      currentSource=winner.provider==='vaplayer'?0:(Number(embedMeta.source)||0);
      if(!(currentSource>=0&&currentSource<streams.length))currentSource=0;
      setStage('Loading '+streams[currentSource].label,70);pFoot.textContent='Trying '+streams[currentSource].label+' of '+streams.length;
      renderPrerollRail(currentSource);updateServerPanel();loadStream(currentSource,true);
    }).catch(function(){if(raceGeneration===providerLoadGeneration)loadProviderAt(0);});
  }
  function loadInitialStreams(){
    // Honor ?provider= / embedMeta.provider. Default is Earth; Earth + Prime
    // race, Turbo is reached only as a last-resort sequential failover.
    var startIdx = providers.indexOf(currentProvider);
    if (startIdx < 0) startIdx = 0;
    if(currentProvider==='turbo'){
      // Turbo HD is CACHED: play it DIRECT with no parallel race. If it fails
      // the normal provider progression falls through to Earth, then Prime.
      runPreroll('Searching ' + providerLabel('turbo') + ' servers');
      pFoot.textContent = 'Contacting ' + providerLabel('turbo') + '…';
      loadProviderAt(startIdx);
    }else if(currentProvider==='vaplayer' && providers.length>1){
      runPreroll('Searching Earth + Prime together');
      pFoot.textContent='Probing Earth and Prime in parallel…';
      raceInitialProviders();
    }else{
      runPreroll('Searching ' + providerLabel(providers[startIdx]) + ' servers');
      pFoot.textContent = 'Contacting ' + providerLabel(providers[startIdx]) + '…';
      loadProviderAt(startIdx);
    }
  }
  updateServerPanel();
  loadInitialStreams();
})();
</script>
</body>
